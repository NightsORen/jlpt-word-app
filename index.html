<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <title>Ford's Daily JLPT</title>

  <!-- iOS "Add to Home Screen" behavior -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Ford's Daily JLPT" />
  <link rel="apple-touch-icon" href="icons/icon-180.png" />

  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <main class="screen" id="screen">

    <header class="top-bar">
      <div class="top-bar-left">
        <span class="app-name">Ford's <span class="app-name-en">daily JLPT</span></span>
        <span class="streak-badge hidden" id="streak-badge"></span>
      </div>
      <div class="top-bar-icons">
        <button class="icon-btn" id="browse-btn" aria-label="Browse and search">🔍</button>
        <button class="icon-btn" id="review-btn" aria-label="Review saved words">📖</button>
        <button class="icon-btn" id="settings-btn" aria-label="Settings">⚙</button>
      </div>
    </header>

    <section class="word-card" id="word-card">
      <div class="hanko" id="level-badge">N5</div>
      <button class="speaker-btn hidden" id="speaker-btn" aria-label="Play pronunciation">🔊</button>

      <p class="furigana" id="furigana">–</p>
      <div class="pitch-display hidden" id="pitch-display"></div>
      <h1 class="kanji" id="kanji">–</h1>
      <p class="uk-tag hidden" id="uk-tag">usually kana</p>
      <p class="romaji" id="romaji">–</p>

      <div class="divider"></div>

      <p class="meaning" id="meaning">Loading…</p>
    </section>

    <div class="action-row">
      <button class="action-btn star-btn" id="star-btn" aria-label="Still learning">
        <span class="action-icon">☆</span>
        <span class="action-label">Learning</span>
      </button>

      <button class="skip-btn" id="skip-btn">Skip</button>

      <button class="action-btn know-btn" id="know-btn" aria-label="Already know it">
        <span class="action-icon">✓</span>
        <span class="action-label">Known</span>
      </button>
    </div>

    <p class="progress-note" id="progress-note"></p>

  </main>

  <!-- Settings panel -->
  <div class="overlay" id="overlay"></div>
  <div class="settings-panel" id="settings-panel">
    <h2>Settings</h2>

    <div class="setting-group">
      <span class="setting-label">Level</span>
      <div class="level-picker" id="level-picker">
        <button data-level="N5" class="level-option">N5</button>
        <button data-level="N4" class="level-option">N4</button>
        <button data-level="N3" class="level-option">N3</button>
      </div>
    </div>

    <div class="setting-group setting-row">
      <span class="setting-label">Show romaji</span>
      <label class="switch">
        <input type="checkbox" id="romaji-toggle" />
        <span class="switch-track"><span class="switch-thumb"></span></span>
      </label>
    </div>

    <div class="setting-group setting-row">
      <span class="setting-label">Show pitch accent</span>
      <label class="switch">
        <input type="checkbox" id="pitch-toggle" />
        <span class="switch-track"><span class="switch-thumb"></span></span>
      </label>
    </div>

    <div class="setting-group">
      <span class="setting-label">Word type</span>
      <div class="chip-row" id="pos-filter-row">
        <button class="chip active" data-value="">All</button>
      </div>
    </div>

    <div class="setting-group">
      <span class="setting-label">Backup &amp; restore</span>
      <div class="backup-row">
        <button class="secondary-btn" id="export-btn">Export progress</button>
        <button class="secondary-btn" id="import-btn">Import progress</button>
      </div>
      <input type="file" id="import-file-input" accept="application/json" class="visually-hidden" />
    </div>

    <button class="close-settings" id="close-settings">Done</button>
  </div>

  <!-- Review page (slides in from the right) -->
  <div class="review-page" id="review-panel">
    <div class="review-page-header">
      <button class="icon-btn" id="review-back" aria-label="Back">←</button>
      <div class="review-heading">
        <span class="review-heading-text" id="review-heading-text">Still Learning</span>
        <button class="icon-btn small" id="review-rename-btn" aria-label="Rename this list">✎</button>
      </div>
      <span class="review-level-tag" id="review-level-label">N5</span>
    </div>

    <div class="review-tabs-row" id="review-tabs">
      <button data-status="still-learning" class="review-tab active">Still Learning</button>
      <button data-status="known" class="review-tab">Known</button>
      <button data-status="all-seen" class="review-tab">All Seen</button>
    </div>

    <div class="review-list" id="review-list">
      <p class="review-empty" id="review-empty">No words here yet.</p>
    </div>
  </div>

  <!-- Browse / search page (slides in from the right) -->
  <div class="review-page" id="browse-panel">
    <div class="review-page-header">
      <button class="icon-btn" id="browse-back" aria-label="Back">←</button>
      <div class="review-heading">
        <span class="review-heading-text">Browse</span>
      </div>
      <span class="review-level-tag" id="browse-level-label">N5</span>
    </div>

    <div class="browse-search-row">
      <input type="text" id="browse-search" class="browse-search-input" placeholder="Search kanji, reading, or meaning" />
    </div>

    <div class="review-list" id="browse-list">
      <p class="review-empty" id="browse-empty">No words match your search.</p>
    </div>
  </div>

  <!-- Word detail page (opens on top of Browse or Review) -->
  <div class="review-page" id="detail-panel">
    <div class="review-page-header">
      <button class="icon-btn" id="detail-back" aria-label="Back">←</button>
      <div class="review-heading">
        <span class="review-heading-text">Word Detail</span>
      </div>
    </div>

    <div class="detail-scroll">
      <section class="word-card detail-word-card">
        <div class="hanko" id="detail-level-badge">N5</div>
        <button class="speaker-btn" id="detail-speaker-btn" aria-label="Play pronunciation">🔊</button>

        <p class="furigana" id="detail-furigana">–</p>
        <div class="pitch-display hidden" id="detail-pitch-display"></div>
        <h1 class="kanji" id="detail-kanji">–</h1>
        <p class="uk-tag hidden" id="detail-uk-tag">usually kana</p>
        <p class="romaji" id="detail-romaji">–</p>

        <div class="divider"></div>

        <p class="meaning" id="detail-meaning">–</p>
      </section>

      <div class="detail-info-rows" id="detail-info-rows"></div>

      <div class="action-row detail-action-row">
        <button class="action-btn star-btn" id="detail-star-btn" aria-label="Still learning">
          <span class="action-icon">☆</span>
          <span class="action-label">Learning</span>
        </button>
        <button class="action-btn know-btn" id="detail-know-btn" aria-label="Already know it">
          <span class="action-icon">✓</span>
          <span class="action-label">Known</span>
        </button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
